name: Test with custom dotenv-linter flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a .env file with duplicate keys (would normally fail)
        run: |
          printf 'FOO=bar\nFOO=baz\n' > "$GITHUB_WORKSPACE/.env"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          dotenv_linter_flags: '--skip DuplicatedKey'
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed with custom flags
        run: |
          echo "PASS: action completed with custom dotenv_linter_flags"
