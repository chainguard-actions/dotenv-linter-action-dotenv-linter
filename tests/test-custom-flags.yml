name: Test custom dotenv_linter_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid .env file
        run: |
          echo "KEY=value" > "$GITHUB_WORKSPACE/.env"

      - name: Set up fake curl, reviewdog, and dotenv-linter
        run: |
          FAKE_BIN="$GITHUB_WORKSPACE/.fake-bin"
          mkdir -p "$FAKE_BIN"

          # Fake install script for reviewdog
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cat > "$BINDIR/reviewdog" << 'RD'
          #!/bin/sh
          cat > /dev/null
          exit 0
          RD
            chmod +x "$BINDIR/reviewdog"
          fi
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          # Fake install script for dotenv-linter that records its args
          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cat > "$BINDIR/dotenv-linter" << 'DL'
          #!/bin/sh
          # Record args for inspection
          echo "$@" > /tmp/dotenv-linter-args.txt
          exit 0
          DL
            chmod +x "$BINDIR/dotenv-linter"
          fi
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Fake curl
          cat > "$FAKE_BIN/curl" << 'CURL'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL
          chmod +x "$FAKE_BIN/curl"

          echo "$FAKE_BIN" >> "$GITHUB_PATH"

      - name: Run dotenv-linter action with custom flags
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          dotenv_linter_flags: '--skip QuoteCharacter'
          reporter: github-pr-check
          filter_mode: nofilter
          fail_level: none

      - name: Assert custom flags were passed to dotenv-linter
        run: |
          if [ ! -f /tmp/dotenv-linter-args.txt ]; then
            echo "FAIL: dotenv-linter was not called"
            exit 1
          fi
          ARGS="$(cat /tmp/dotenv-linter-args.txt)"
          echo "dotenv-linter args: $ARGS"
          if echo "$ARGS" | grep -q "QuoteCharacter"; then
            echo "PASS: custom flag '--skip QuoteCharacter' was passed to dotenv-linter"
          else
            echo "FAIL: expected '--skip QuoteCharacter' in args but got: $ARGS"
            exit 1
          fi
