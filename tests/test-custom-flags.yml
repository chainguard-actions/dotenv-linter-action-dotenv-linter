name: Test custom dotenv_linter_flags are passed through
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl that installs mock tools (dotenv-linter records flags)
        run: |
          # Create a fake reviewdog install script
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -z "$BINDIR" ]; then
            BINDIR="/usr/local/bin"
          fi
          cat > "$BINDIR/reviewdog" << 'EOF'
          #!/bin/sh
          # Fake reviewdog - consume stdin and exit 0
          cat > /dev/null
          exit 0
          EOF
          chmod +x "$BINDIR/reviewdog"
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          # Create a fake dotenv-linter install script that records its arguments
          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -z "$BINDIR" ]; then
            BINDIR="/usr/local/bin"
          fi
          cat > "$BINDIR/dotenv-linter" << 'EOF'
          #!/bin/sh
          # Fake dotenv-linter - record args and exit 0
          echo "$@" > /tmp/dotenv-linter-args.txt
          exit 0
          EOF
          chmod +x "$BINDIR/dotenv-linter"
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Create a fake curl that intercepts the installer URLs
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'EOF'
          #!/bin/sh
          # Fake curl: serve canned payloads for intercepted URLs, supporting both
          # "curl URL | sh" (payload to stdout) and hardened "curl -o FILE URL"
          # (payload written to FILE).
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          EOF
          chmod +x /tmp/fake-bin/curl

      - name: Run action with custom dotenv_linter_flags
        id: action
        uses: .
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          github_token: ${{ github.token }}
          dotenv_linter_flags: '--skip UnorderedKey'
          reporter: github-pr-check
          filter_mode: nofilter
          fail_on_error: 'false'

      - name: Assert custom flags were passed to dotenv-linter
        run: |
          if [ ! -f /tmp/dotenv-linter-args.txt ]; then
            echo "FAIL: dotenv-linter was not called (args file not found)"
            exit 1
          fi
          ARGS=$(cat /tmp/dotenv-linter-args.txt)
          echo "dotenv-linter args: $ARGS"
          if echo "$ARGS" | grep -q "UnorderedKey"; then
            echo "PASS: custom flag '--skip UnorderedKey' was passed to dotenv-linter"
          else
            echo "FAIL: expected '--skip UnorderedKey' in args but got: $ARGS"
            exit 1
          fi
