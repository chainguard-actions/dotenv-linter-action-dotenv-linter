name: Test with .env file that has linting issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an .env file with issues
        run: |
          # Create a .env file with known issues (duplicate key, leading space)
          printf ' SPACED=\nKEY = VALUE\n\nSECRET="my value"\n\nSECRET=Already defined\n' > "$GITHUB_WORKSPACE/.env"

      - name: Set up fake curl, reviewdog, and dotenv-linter
        run: |
          FAKE_BIN="$GITHUB_WORKSPACE/.fake-bin"
          mkdir -p "$FAKE_BIN"

          # Fake install script for reviewdog
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cat > "$BINDIR/reviewdog" << 'RD'
          #!/bin/sh
          # Fake reviewdog: consume stdin, always exit 0 (fail_level=none)
          cat > /dev/null
          exit 0
          RD
            chmod +x "$BINDIR/reviewdog"
          fi
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          # Fake install script for dotenv-linter that reports issues
          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cat > "$BINDIR/dotenv-linter" << 'DL'
          #!/bin/sh
          # Fake dotenv-linter: output issues in dotenv-linter format
          echo ".env:1 LeadingCharacter: Invalid leading character detected"
          echo ".env:2 SpaceCharacter: Invalid space character detected"
          echo ".env:6 DuplicatedKey: The SECRET key is duplicated"
          exit 1
          DL
            chmod +x "$BINDIR/dotenv-linter"
          fi
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Fake curl
          cat > "$FAKE_BIN/curl" << 'CURL'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL
          chmod +x "$FAKE_BIN/curl"

          echo "$FAKE_BIN" >> "$GITHUB_PATH"

      - name: Run dotenv-linter action (issues present, fail_level=none so should succeed)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-pr-check
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully despite issues
        run: |
          echo "PASS: action completed with exit 0 because fail_level=none"
