name: Test github-code-suggestions reporter path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git user for stash operations
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a valid .env file and commit it
        run: |
          echo "KEY=value" > "$GITHUB_WORKSPACE/.env"
          git add .env
          git commit -m "Add .env for testing" || true

      - name: Set up fake curl, reviewdog, and dotenv-linter
        run: |
          FAKE_BIN="$GITHUB_WORKSPACE/.fake-bin"
          mkdir -p "$FAKE_BIN"

          # Fake install script for reviewdog
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cat > "$BINDIR/reviewdog" << 'RD'
          #!/bin/sh
          # Fake reviewdog: consume stdin and exit 0
          cat > /dev/null
          exit 0
          RD
            chmod +x "$BINDIR/reviewdog"
          fi
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          # Fake install script for dotenv-linter (fix mode - no output, just exits 0)
          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cat > "$BINDIR/dotenv-linter" << 'DL'
          #!/bin/sh
          # Fake dotenv-linter: in fix mode, do nothing (file already valid)
          exit 0
          DL
            chmod +x "$BINDIR/dotenv-linter"
          fi
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Fake curl
          cat > "$FAKE_BIN/curl" << 'CURL'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL
          chmod +x "$FAKE_BIN/curl"

          echo "$FAKE_BIN" >> "$GITHUB_PATH"

      - name: Run dotenv-linter action with github-code-suggestions reporter
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-code-suggestions
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with github-code-suggestions reporter"
