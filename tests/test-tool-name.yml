name: Test custom tool_name is passed to reviewdog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl that installs mock tools (reviewdog records its args)
        run: |
          # Create a fake reviewdog install script that records args
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -z "$BINDIR" ]; then
            BINDIR="/usr/local/bin"
          fi
          cat > "$BINDIR/reviewdog" << 'EOF'
          #!/bin/sh
          # Fake reviewdog - record args and consume stdin
          echo "$@" > /tmp/reviewdog-args.txt
          cat > /dev/null
          exit 0
          EOF
          chmod +x "$BINDIR/reviewdog"
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          # Create a fake dotenv-linter install script
          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -z "$BINDIR" ]; then
            BINDIR="/usr/local/bin"
          fi
          cat > "$BINDIR/dotenv-linter" << 'EOF'
          #!/bin/sh
          # Fake dotenv-linter - exit 0 (no issues)
          exit 0
          EOF
          chmod +x "$BINDIR/dotenv-linter"
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Create a fake curl that intercepts the installer URLs
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'EOF'
          #!/bin/sh
          # Fake curl: serve canned payloads for intercepted URLs, supporting both
          # "curl URL | sh" (payload to stdout) and hardened "curl -o FILE URL"
          # (payload written to FILE).
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          EOF
          chmod +x /tmp/fake-bin/curl

      - name: Run action with custom tool_name
        id: action
        uses: .
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          github_token: ${{ github.token }}
          tool_name: 'my-custom-linter'
          reporter: github-pr-check
          filter_mode: nofilter
          fail_on_error: 'false'

      - name: Assert custom tool_name was passed to reviewdog
        run: |
          if [ ! -f /tmp/reviewdog-args.txt ]; then
            echo "FAIL: reviewdog was not called (args file not found)"
            exit 1
          fi
          ARGS=$(cat /tmp/reviewdog-args.txt)
          echo "reviewdog args: $ARGS"
          if echo "$ARGS" | grep -q "my-custom-linter"; then
            echo "PASS: custom tool_name 'my-custom-linter' was passed to reviewdog"
          else
            echo "FAIL: expected 'my-custom-linter' in reviewdog args but got: $ARGS"
            exit 1
          fi
