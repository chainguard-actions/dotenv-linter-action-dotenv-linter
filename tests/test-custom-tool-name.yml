name: Test custom tool_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid .env file
        run: |
          printf 'APP_NAME=myapp\nAPP_ENV=production\nAPP_PORT=8080\n' > "$GITHUB_WORKSPACE/.env"

      - name: Run dotenv-linter action with custom tool name
        id: action
        uses: .
        with:
          github_token: fake-token-for-local-test
          tool_name: 'my-custom-dotenv-linter'
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          dotenv_linter_flags: '.env'

      - name: Assert action completed with custom tool name
        run: |
          echo "Action completed with custom tool_name - PASS"
