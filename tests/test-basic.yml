name: Test basic usage - clean .env file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean .env file
        run: |
          cat > "$GITHUB_WORKSPACE/.env" << 'EOF'
          HELLO=world
          FOO=bar
          EOF

      - name: Set up fake curl that installs stub binaries
        run: |
          # Create stub dotenv-linter that exits 0 (no issues)
          cat > /tmp/fake-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          # Fake dotenv-linter: exits 0 with no output (clean)
          exit 0
          SCRIPT
          chmod +x /tmp/fake-dotenv-linter.sh

          # Create stub reviewdog that exits 0
          cat > /tmp/fake-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          # Fake reviewdog: consume stdin and exit 0
          cat > /dev/null
          exit 0
          SCRIPT
          chmod +x /tmp/fake-reviewdog.sh

          # Create fake install scripts that copy stubs to the target -b dir
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          # Parse -b <dir> and version from args
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cp /tmp/fake-reviewdog.sh "$BINDIR/reviewdog"
            chmod +x "$BINDIR/reviewdog"
          fi
          exit 0
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          # Parse -b <dir> and version from args
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cp /tmp/fake-dotenv-linter.sh "$BINDIR/dotenv-linter"
            chmod +x "$BINDIR/dotenv-linter"
          fi
          exit 0
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Create fake curl that serves the right install script
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'SCRIPT'
          #!/bin/sh
          # Fake curl: honor -o <file> flag; serve canned install scripts
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          SCRIPT
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run action on clean .env file
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: 'false'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
