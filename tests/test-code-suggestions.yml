name: Test github-code-suggestions reporter path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a .env file
        run: |
          printf 'FOO=bar\n' > "$GITHUB_WORKSPACE/.env"

      - name: Configure git user for stash operations
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up fake curl and binaries for code-suggestions path
        run: |
          # Create stub dotenv-linter fix that does nothing (no changes)
          cat > /tmp/fake-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          # Record subcommand
          echo "$@" > /tmp/dotenv-linter-args.txt
          # 'fix' subcommand: do nothing (no changes to files)
          exit 0
          SCRIPT
          chmod +x /tmp/fake-dotenv-linter.sh

          # Create stub reviewdog that records its flags
          cat > /tmp/fake-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          # Record args
          echo "$@" > /tmp/reviewdog-args.txt
          # Consume stdin
          cat > /dev/null
          exit 0
          SCRIPT
          chmod +x /tmp/fake-reviewdog.sh

          # Create fake install scripts
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cp /tmp/fake-reviewdog.sh "$BINDIR/reviewdog"
            chmod +x "$BINDIR/reviewdog"
          fi
          exit 0
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cp /tmp/fake-dotenv-linter.sh "$BINDIR/dotenv-linter"
            chmod +x "$BINDIR/dotenv-linter"
          fi
          exit 0
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Create fake curl
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'SCRIPT'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          SCRIPT
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run action with github-code-suggestions reporter
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-code-suggestions
          filter_mode: nofilter
          fail_on_error: 'false'

      - name: Assert dotenv-linter fix was called
        run: |
          if [ ! -f /tmp/dotenv-linter-args.txt ]; then
            echo "FAIL: dotenv-linter was not called"
            exit 1
          fi
          ARGS="$(cat /tmp/dotenv-linter-args.txt)"
          echo "dotenv-linter args: $ARGS"
          if echo "$ARGS" | grep -q "fix"; then
            echo "PASS: dotenv-linter fix was called for code-suggestions path"
          else
            echo "FAIL: expected 'fix' subcommand in dotenv-linter args, got: $ARGS"
            exit 1
          fi

      - name: Assert reviewdog was called with diff format
        run: |
          if [ ! -f /tmp/reviewdog-args.txt ]; then
            echo "FAIL: reviewdog was not called"
            exit 1
          fi
          ARGS="$(cat /tmp/reviewdog-args.txt)"
          echo "reviewdog args: $ARGS"
          if echo "$ARGS" | grep -q "\-f=diff"; then
            echo "PASS: reviewdog was called with -f=diff for code-suggestions path"
          else
            echo "FAIL: expected '-f=diff' in reviewdog args, got: $ARGS"
            exit 1
          fi
