name: Test fail_on_error=false with lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a .env file with issues
        run: |
          printf 'hello=world\nFOO =bar\n' > "$GITHUB_WORKSPACE/.env"

      - name: Set up fake curl that installs stub binaries
        run: |
          # Create stub dotenv-linter that reports a lint error
          cat > /tmp/fake-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          # Fake dotenv-linter: output a lint warning (non-zero exit for issues)
          echo ".env:1 LowercaseKey: The hello key should be in uppercase"
          exit 1
          SCRIPT
          chmod +x /tmp/fake-dotenv-linter.sh

          # Create stub reviewdog that exits 0 regardless (fail_on_error=false)
          cat > /tmp/fake-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          # Fake reviewdog: consume stdin and exit 0 (fail_on_error=false)
          cat > /dev/null
          exit 0
          SCRIPT
          chmod +x /tmp/fake-reviewdog.sh

          # Create fake install scripts
          cat > /tmp/fake-install-reviewdog.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cp /tmp/fake-reviewdog.sh "$BINDIR/reviewdog"
            chmod +x "$BINDIR/reviewdog"
          fi
          exit 0
          SCRIPT
          chmod +x /tmp/fake-install-reviewdog.sh

          cat > /tmp/fake-install-dotenv-linter.sh << 'SCRIPT'
          #!/bin/sh
          BINDIR=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$BINDIR" ]; then
            cp /tmp/fake-dotenv-linter.sh "$BINDIR/dotenv-linter"
            chmod +x "$BINDIR/dotenv-linter"
          fi
          exit 0
          SCRIPT
          chmod +x /tmp/fake-install-dotenv-linter.sh

          # Create fake curl
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'SCRIPT'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-reviewdog.sh > "$out"
              else
                cat /tmp/fake-install-reviewdog.sh
              fi
              exit 0
              ;;
            *dotenv-linter*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-dotenv-linter.sh > "$out"
              else
                cat /tmp/fake-install-dotenv-linter.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          SCRIPT
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run action with fail_on_error=false (should succeed even with lint errors)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: 'false'

      - name: Assert action completed successfully despite lint errors
        run: |
          echo "Action completed without error (fail_on_error=false)"
          echo "PASS"
