name: Test basic usage with valid .env file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid .env file in workspace
        run: |
          printf 'FOO=bar\nBAR=baz\n' > "$GITHUB_WORKSPACE/.env"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"
