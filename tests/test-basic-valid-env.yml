name: Test basic usage with valid .env file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid .env file
        run: |
          cat > "$GITHUB_WORKSPACE/.env" << 'EOF'
          APP_NAME=myapp
          APP_ENV=production
          APP_PORT=8080
          EOF

      - name: Run dotenv-linter action
        id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          reporter: github-pr-check
          filter_mode: nofilter
          fail_on_error: 'false'
          reviewdog_flags: '-reporter=local'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
